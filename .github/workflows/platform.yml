name: platform

on:
  push:
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform.yml"]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm --filter @crs/web build

      - name: High-severity dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pnpm test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            platform/test-results
            platform/playwright-report
          retention-days: 7

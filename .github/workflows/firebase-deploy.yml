name: deploy firebase config

# Vercel deploys the web app and nothing else. Firestore rules, indexes and
# Cloud Functions ship only via `firebase deploy`, which nobody was running --
# so four security fixes sat in the repository while production kept the holes
# they closed.
#
# This runs on any change to those files, and can be triggered by hand.
#
# One-time setup:
#   1. Create a service account in the Firebase console with the roles
#      "Firebase Rules Admin", "Cloud Datastore Index Admin" and
#      "Cloud Functions Admin" (plus "Service Account User").
#   2. Download its JSON key.
#   3. Add it as a repository secret named FIREBASE_SERVICE_ACCOUNT.
#
# The project id is read from the key itself, so no variable is needed. Set a
# FIREBASE_PROJECT_ID repository variable only if you want to deploy somewhere
# other than the project the key belongs to.
#
# Until the secret exists the job stops with an explanatory message rather than
# failing obscurely.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "functions/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The rules are tested before they are deployed, never after. A rule that
      # denies a write the app depends on takes the product down silently.
      - name: Install rules test harness
        working-directory: firestore-tests
        run: npm install --no-audit --no-fund

      - name: Firestore rules tests
        working-directory: firestore-tests
        run: npm test

      - name: Check credentials are configured
        id: creds
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set — nothing was deployed. See the header of this workflow for setup."
            exit 0
          fi

          # The project id is inside the service account JSON, so the variable
          # is optional. One less thing to configure and one less thing to get
          # wrong: a missing variable used to mean deploying to an empty
          # project name, which fails with nothing useful in the message.
          if [ -n "$PROJECT_VAR" ]; then
            PROJECT="$PROJECT_VAR"
            echo "Project from FIREBASE_PROJECT_ID variable: $PROJECT"
          else
            PROJECT=$(printf '%s' "$KEY" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).project_id||"")}catch(e){}})')
            echo "Project read from the service account key: $PROJECT"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not determine the Firebase project. Set the FIREBASE_PROJECT_ID repository variable, or check that FIREBASE_SERVICE_ACCOUNT contains valid JSON with a project_id field."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install functions dependencies
        if: steps.creds.outputs.configured == 'true'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Write credentials
        if: steps.creds.outputs.configured == 'true'
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_KEY" > "$GITHUB_WORKSPACE/service-account.json"

      # Rules and indexes are the security-critical half and deploy on their
      # own. They are separated from functions deliberately: a key generated
      # from the Firebase console carries the Firebase permissions but not
      # Cloud Functions Admin, and a combined command would fail on the
      # functions half and leave the rules unshipped -- the exact outcome this
      # workflow exists to prevent.
      - name: Deploy rules and indexes
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          PROJECT_ID: ${{ steps.creds.outputs.project }}
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive

      # Scheduled cleanup and the admin callable. Nothing user-facing breaks if
      # this cannot deploy, so a permission gap here is a warning, not a
      # failure that would mask a successful rules deploy above.
      - name: Deploy functions
        id: functions
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          PROJECT_ID: ${{ steps.creds.outputs.project }}
        run: |
          npx --yes firebase-tools@13 deploy \
            --only functions \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Note if functions did not deploy
        if: steps.functions.outcome == 'failure'
        run: |
          echo "::warning::Rules and indexes deployed; functions did not. The service account most likely lacks Cloud Functions Admin. Nothing user-facing depends on the functions, so this is not urgent — add the role when convenient."

      - name: Remove credentials
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/service-account.json"
